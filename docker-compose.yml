services:
  neo4j:
    image: neo4j:5.15-community
    container_name: desktop-agent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/graphrag
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      # HTTP check so we don't depend on cypher-shell auth (volume may have different password)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - desktop-agent-network
    restart: unless-stopped

  desktop-agent:
    build:
      context: .
      dockerfile: dockerfile
    container_name: desktop-agent-app
    depends_on:
      neo4j:
        condition: service_started
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphrag
      - LLM_URL=http://model-runner.docker.internal:12434/engines/v1
      - EMBEDDING_URL=http://model-runner.docker.internal:12434/engines/v1
      - LLM_MODEL=ai/qwen3:4B-UD-Q8_K_XL
      - EMBEDDING_MODEL=hf.co/Mungert/all-MiniLM-L6-v2-GGUF:q8_0
      - MODEL_RUNNER_PORT=12434
      - AGENT_WORKDIR=/app/workspace
      - GUI_HOST=0.0.0.0
      - GUI_PORT=5000
    ports:
      - "${GUI_PORT:-5000}:5000"
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    volumes:
      - ./graphrag:/app/graphrag
      - ./main.py:/app/main.py
      - ./startup.py:/app/startup.py
      - ./agent.py:/app/agent.py
      - ./shell_session.py:/app/shell_session.py
      - ./web_app.py:/app/web_app.py
      - ./command_history.py:/app/command_history.py
      - ./tests:/app/tests
      - ./workspace:/app/workspace
    command: ["uv", "run", "python", "/app/startup.py"]
    networks:
      - desktop-agent-network
    restart: unless-stopped

networks:
  desktop-agent-network:
    driver: bridge

volumes:
  neo4j_data: